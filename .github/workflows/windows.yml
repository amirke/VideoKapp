name: Build Windows portable ZIP
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Download verified FFmpeg
        shell: powershell
        run: ./scripts/setup-ffmpeg.ps1
      - name: Focused checks
        run: node --test test/ai-reuse.test.cjs test/ride-export.test.cjs test/route-progress.test.cjs
      - run: node package.cjs dist/ChronoMerge
      - name: Create ZIP
        shell: powershell
        run: Compress-Archive -Path dist/ChronoMerge -DestinationPath dist/ChronoMerge-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ChronoMerge-Windows-x64
          path: dist/ChronoMerge-Windows-x64.zip
          retention-days: 30
